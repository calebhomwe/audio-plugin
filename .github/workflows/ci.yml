name: CI

on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      JUCE_TAG: 8.0.9
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev \
            libcurl4-openssl-dev libgtk-3-dev mesa-common-dev libglu1-mesa-dev xvfb

      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../JUCE
          key: juce-${{ env.JUCE_TAG }}

      - name: Fetch JUCE ${{ env.JUCE_TAG }}
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git "$GITHUB_WORKSPACE/../JUCE"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_SOURCE_DIR_JUCE="$GITHUB_WORKSPACE/../JUCE" \
            -DMIXAGENT_COPY_PLUGIN=OFF -DCMAKE_CXX_FLAGS="-Wall -Wextra"

      - name: Build tests + VST3
        run: cmake --build build --target MixAgentSmokeTest EditorProbe MixAgent_VST3

      - name: Smoke test (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Editor probe (xvfb)
        run: xvfb-run -a ./build/EditorProbe_artefacts/Release/EditorProbe
