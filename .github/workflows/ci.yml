name: CI

on:
  push:
  pull_request:
  # The two long checks are manual: pluginval at strictness 10 and the mutation
  # audit each take longer than the whole build, and neither belongs on a push.
  workflow_dispatch:
    inputs:
      pluginval:
        description: "Also run pluginval at strictness 5 and 10"
        type: boolean
        default: true
      mutation_audit:
        description: "Also run the mutation audit (every defect in Source/DSP/Mutate.h)"
        type: boolean
        default: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      JUCE_TAG: 8.0.9
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev \
            libcurl4-openssl-dev libgtk-3-dev mesa-common-dev libglu1-mesa-dev xvfb

      - name: Cache JUCE
        id: juce-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../JUCE
          key: juce-${{ env.JUCE_TAG }}

      - name: Fetch JUCE ${{ env.JUCE_TAG }}
        if: steps.juce-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git "$GITHUB_WORKSPACE/../JUCE"

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_SOURCE_DIR_JUCE="$GITHUB_WORKSPACE/../JUCE" \
            -DMIXAGENT_COPY_PLUGIN=OFF -DCMAKE_CXX_FLAGS="-Wall -Wextra"

      - name: Build tests + VST3
        run: |
          cmake --build build --target MixAgentSmokeTest MixAgentAuditTest \
            MixAgentCharacterTest EditorProbe MixAgent_VST3

      - name: Tests (ctest)
        run: ctest --test-dir build --output-on-failure

      - name: Editor probe (xvfb)
        run: xvfb-run -a ./build/EditorProbe_artefacts/Release/EditorProbe

      # The stricter set is applied to the project's OWN sources only: JUCE's
      # headers come in through -isystem so the build is not judged on them, and
      # nothing is compiled twice - this is a syntax-only pass.
      - name: Strict warnings on our own sources
        run: |
          FLAGS=$(ninja -C build -t commands MixAgentSmokeTest | grep -m1 'PluginProcessor.cpp.o' \
                    | sed 's|^/usr/bin/c++ ||; s| -o .*||; s| -MD .*||; s|-I\([^ ]*\)|-isystem \1|g')
          STRICT="-Wall -Wextra -Wshadow -Wnon-virtual-dtor -Woverloaded-virtual -Wunused -Werror"
          for f in Source/PluginProcessor.cpp Source/PluginEditor.cpp \
                   Tests/SmokeTest.cpp Tests/AuditTest.cpp Tests/CharacterTest.cpp \
                   Tests/EditorProbe.cpp Tests/ReverbProbe.cpp; do
            echo "== $f"
            /usr/bin/c++ $FLAGS $STRICT -I"$PWD" -fsyntax-only "$f"
          done

  # ---------------------------------------------------------------------------
  # pluginval, manual only. It found a state-restoration defect that five passes
  # of this repository's own tests missed, so it is worth having wired up - but
  # the strictness-10 run opens the editor and walks every parameter, and it is
  # far too slow for a push.
  #
  # PLUGINVAL_VST3_VALIDATOR=OFF matches how this was run locally: without
  # Steinberg's embedded validator, so the "vst3 validator" group is SKIPPED and
  # the other 58 checks run.
  pluginval:
    if: github.event_name == 'workflow_dispatch' && inputs.pluginval
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      JUCE_TAG: 8.0.9
      PLUGINVAL_REV: 4c5adc2c1a9910251667152166139a0c37b953e6
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev \
            libcurl4-openssl-dev libgtk-3-dev mesa-common-dev libglu1-mesa-dev xvfb

      - name: Fetch JUCE ${{ env.JUCE_TAG }}
        run: git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git "$GITHUB_WORKSPACE/../JUCE"

      - name: Build the VST3
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DFETCHCONTENT_SOURCE_DIR_JUCE="$GITHUB_WORKSPACE/../JUCE" -DMIXAGENT_COPY_PLUGIN=OFF
          cmake --build build --target MixAgent_VST3

      - name: Build pluginval
        run: |
          git clone https://github.com/Tracktion/pluginval.git "$GITHUB_WORKSPACE/../pluginval"
          git -C "$GITHUB_WORKSPACE/../pluginval" checkout "$PLUGINVAL_REV"
          cmake -S "$GITHUB_WORKSPACE/../pluginval" -B "$GITHUB_WORKSPACE/../pluginval/build" \
            -G Ninja -DCMAKE_BUILD_TYPE=Release -DPLUGINVAL_VST3_VALIDATOR=OFF
          cmake --build "$GITHUB_WORKSPACE/../pluginval/build" --target pluginval

      - name: pluginval, strictness 5
        run: |
          xvfb-run -a "$GITHUB_WORKSPACE/../pluginval/build/pluginval_artefacts/Release/pluginval" \
            --strictness-level 5 --timeout-ms 900000 \
            --validate build/MixAgent_artefacts/Release/VST3/MixAgent.vst3

      - name: pluginval, strictness 10
        run: |
          xvfb-run -a "$GITHUB_WORKSPACE/../pluginval/build/pluginval_artefacts/Release/pluginval" \
            --strictness-level 10 --timeout-ms 900000 \
            --validate build/MixAgent_artefacts/Release/VST3/MixAgent.vst3

  # ---------------------------------------------------------------------------
  # The mutation audit: compiles each deliberate defect in Source/DSP/Mutate.h in
  # turn and fails if the suite stays green for any of them. Twenty builds, so
  # manual only.
  mutation-audit:
    if: github.event_name == 'workflow_dispatch' && inputs.mutation_audit
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      JUCE_TAG: 8.0.9
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libxcomposite-dev libfreetype-dev libfontconfig1-dev \
            libcurl4-openssl-dev libgtk-3-dev mesa-common-dev libglu1-mesa-dev xvfb

      - name: Fetch JUCE ${{ env.JUCE_TAG }}
        run: git clone --depth 1 --branch "$JUCE_TAG" https://github.com/juce-framework/JUCE.git "$GITHUB_WORKSPACE/../JUCE"

      - name: Mutation audit
        run: MUT_JUCE="$GITHUB_WORKSPACE/../JUCE" MUT_JOBS=3 tools/mutation_audit.sh
